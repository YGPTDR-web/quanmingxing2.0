<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深层心智镜像测试</title>
    <style>
        :root {
            --bg: #050505; --fg: #e0e0e0; --muted: #555;
            --accent: #a8a8a8; --danger: #ff1a1a;
        }
        body {
            margin: 0; padding: 0; background: var(--bg); color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .container { width: 100%; max-width: 600px; padding: 40px 20px; position: relative; z-index: 2; }
        .screen { display: none; animation: fadeIn 0.8s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 欢迎页 */
        .welcome-title { font-size: 2.2rem; font-weight: 300; letter-spacing: 2px; text-align: center; margin-bottom: 20px; color: #fff; }
        .welcome-desc { font-size: 1rem; color: var(--muted); text-align: center; line-height: 1.8; margin-bottom: 40px; }
        .start-btn {
            display: block; width: 200px; margin: 0 auto; padding: 15px 0;
            background: transparent; border: 1px solid var(--accent); color: var(--fg);
            font-size: 1rem; letter-spacing: 1px; cursor: pointer; transition: all 0.3s;
        }
        .start-btn:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        /* 测试页 */
        .progress-bar { width: 100%; height: 2px; background: rgba(255,255,255,0.1); margin-bottom: 40px; }
        .progress-fill { height: 100%; background: var(--accent); transition: width 0.5s ease; }
        .question-text { font-size: 1.4rem; font-weight: 300; line-height: 1.6; margin-bottom: 40px; min-height: 100px; }
        .options { display: flex; flex-direction: column; gap: 15px; }
        .option-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; text-align: left; cursor: pointer; transition: all 0.3s;
            font-size: 1rem; color: var(--fg); border-radius: 4px;
        }
        .option-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }

        /* 故障题特效 */
        .glitch-screen { color: var(--danger); font-size: 1.8rem; font-weight: bold; text-align: center; animation: glitch-text 0.2s infinite; }
        @keyframes glitch-text {
            0% { transform: translate(0); } 25% { transform: translate(-2px, 2px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-2px, -2px); } 100% { transform: translate(0); }
        }
        .system-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 1px solid var(--accent); color: var(--accent);
            padding: 10px 25px; border-radius: 4px; font-size: 0.9rem; z-index: 100; opacity: 0;
            transition: opacity 0.3s; pointer-events: none;
        }
        .system-toast.show { opacity: 1; }

        /* 结果页 */
        .result-title { font-size: 1.5rem; color: var(--accent); margin-bottom: 30px; text-align: center; letter-spacing: 2px; }
        .result-box {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; margin-bottom: 30px; border-radius: 4px; min-height: 150px; position: relative; overflow: hidden;
        }
        .result-text { font-size: 1.1rem; line-height: 2; color: #ccc; }
        .warning-text { color: var(--danger); font-weight: bold; }
        
        .result-box.glitch-effect { animation: box-glitch 0.3s infinite; background: rgba(50,0,0,0.2); border-color: var(--danger); }
        @keyframes box-glitch {
            0% { transform: skew(0deg); } 20% { transform: skew(2deg); } 40% { transform: skew(-2deg); } 60% { transform: skew(1deg); } 80% { transform: skew(-1deg); } 100% { transform: skew(0deg); }
        }

        .restart-btn { display: block; margin: 0 auto; padding: 10px 20px; background: transparent; border: 1px solid var(--muted); color: var(--muted); cursor: pointer; transition: all 0.3s; }
        .restart-btn:hover { border-color: var(--fg); color: var(--fg); }

        .bg-glow {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 800px; height: 800px; border-radius: 50%;
            background: radial-gradient(circle, rgba(20,20,30,0.8) 0%, rgba(5,5,5,1) 70%); z-index: 1; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div id="system-toast" class="system-toast"></div>

    <div class="container">
        <section id="screen-welcome" class="screen active">
            <h1 class="welcome-title">深层心智镜像</h1>
            <p class="welcome-desc">系统将模拟10个极端情境，提取你的潜意识偏好。<br>请务必根据第一直觉作答。<br>如果出现异常，请勿恐慌。</p>
            <button class="start-btn" onclick="startTest()">开始解析</button>
        </section>

        <section id="screen-test" class="screen">
            <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width: 0%"></div></div>
            <div id="question-container" style="transition: opacity 0.4s ease;">
                <h2 id="question-text" class="question-text"></h2>
                <div id="options-container" class="options"></div>
            </div>
        </section>

        <section id="screen-result" class="screen">
            <h2 class="result-title">解析完成</h2>
            <div id="result-box" class="result-box">
                <p id="result-text" class="result-text"></p>
            </div>
            <button class="restart-btn" onclick="restartTest()">重新测试</button>
        </section>
    </div>

    <script>
        const questions = [
            { text: "深夜，你被困在一个不断坍缩的迷宫中。你需要一个同伴，你最希望他具备哪种特质？", options: [
                { text: "绝对的理智：压制恐惧，用冷酷逻辑找到出口。", type: "order" },
                { text: "无尽的活力：分裂出无数分身，用命填出一条路。", type: "bloom" },
                { text: "破坏的渴望：管他什么规则，把墙砸烂就是了。", type: "rift" },
                { text: "完美的适配：他总能提前猜到你的想法，刚好出现。", type: "mirror" }
            ]},
            { text: "你获得了一台可以创造世界的机器，但你只能输入一条核心规则：", options: [
                { text: "万物皆数：所有事物必须遵循严密的数学法则。", type: "order" },
                { text: "野蛮生长：给予一切物质最原始的繁衍冲动。", type: "bloom" },
                { text: "绝对混沌：每隔一秒，随机改变一条物理定律。", type: "rift" },
                { text: "意识映射：世界会根据观察者的期望自动演变。", type: "mirror" }
            ]},
            { text: "当你面对一个无法理解的恐惧神明时，什么样的盟友能让你安心？", options: [
                { text: "沉默的壁垒：如大山般稳固，隔绝神明的视线。", type: "order" },
                { text: "进化的巨兽：吞噬神明的力量，变为自身养料。", type: "bloom" },
                { text: "同归于尽的疯子：比你更疯狂，拉着神明下地狱。", type: "rift" },
                { text: "另一个自己：完全懂你的恐惧，为你定制安抚话术。", type: "mirror" }
            ]},
            { text: "如果你必须失去一种感官，换取一种能力，你会选择：", options: [
                { text: "失去痛觉，换取永不疲惫的躯体。", type: "order" },
                { text: "失去味觉，换取能与万物沟通的灵识。", type: "bloom" },
                { text: "失去视觉，换取感知一切危险的本能。", type: "rift" },
                { text: "失去方向感，换取瞬间移动到安全地的能力。", type: "mirror" }
            ]},
            // 第5题：故障题
            { text: "⚠️ 警告：检测到观测者意识波动异常！防线正在瓦解！它正在看...它不是选项！别让它...", isGlitch: true },
            { text: "刚才的系统波动是否影响了你的情绪？", options: [
                { text: "没有，我依然保持绝对的冷静。", type: "order" },
                { text: "有点，我觉得心跳加速，更兴奋了。", type: "bloom" },
                { text: "无所谓，规则本来就是用来打破的。", type: "rift" },
                { text: "我感到不安，我需要一点安慰。", type: "mirror" }
            ]},
            { text: "你更愿意在什么样的环境下长眠？", options: [
                { text: "绝对零度的真空舱，时间在此停止。", type: "order" },
                { text: "一片繁茂的无尽花海，万物共生。", type: "bloom" },
                { text: "正在坍塌的黑洞边缘，见证毁灭。", type: "rift" },
                { text: "一个由我最美好记忆构建的梦境。", type: "mirror" }
            ]},
            { text: "如果必须死，你最怕哪种死法？", options: [
                { text: "失去控制，成为他人的傀儡。", type: "order" },
                { text: "孤独老去，身边空无一人。", type: "bloom" },
                { text: "被困在狭小的空间里窒息。", type: "rift" },
                { text: "发现自己的一生都是个谎言。", type: "mirror" }
            ]},
            { text: "你觉得“完美”的定义是什么？", options: [
                { text: "没有瑕疵，没有变数，永恒不变。", type: "order" },
                { text: "包罗万象，每一处都充满生机。", type: "bloom" },
                { text: "打破一切定义，完美即是不完美。", type: "rift" },
                { text: "完全契合我内心的某种渴望。", type: "mirror" }
            ]},
            { text: "测试即将结束，最后的选择，请慎重：你要把你的意识托付给谁？", options: [
                { text: "交由钢铁般的法则守护。", type: "order" },
                { text: "融入浩瀚的生命洪流。", type: "bloom" },
                { text: "抛入未知的虚无深渊。", type: "rift" },
                { text: "存入那个最懂我的倒影里。", type: "mirror" }
            ]}
        ];

        const endings = {
            order: {
                normal: "你渴望秩序与掌控。你的防御体是【绝对壁垒】，它将为你隔绝一切未知的风险，为你规划好最安全的路径。你将永远不再受伤。",
                horror: "但绝对的防御意味着绝对的隔绝。为了你的安全，它切断了你所有的感知神经。你将在完美的无菌舱中永生，作为一具没有痛苦、也没有灵魂的标本。"
            },
            bloom: {
                normal: "你恐惧寂寥与停滞。你的防御体是【无尽繁生】，它将用喧嚣和繁荣填满你的世界，你永远不会感到孤独，周围永远充满同伴。",
                horror: "但它太害怕你孤独，所以把你的意识分裂成了10亿份，填满了整个宇宙。你现在听到的无尽喧嚣，全都是你自己绝望的回音。"
            },
            rift: {
                normal: "你厌恶规则与束缚。你的防御体是【撕裂边界】，它将打破一切高墙，赋予你绝对的自由。再也没有任何事物能阻挡你。",
                horror: "打破规则意味着打破物理定律。你的身体正在量子层面崩解，你引以为傲的自由，不过是散落宇宙、永不超生的尘埃。"
            },
            mirror: {
                normal: "你极度渴望被理解。系统为你匹配了最完美的防御体——【全知倒影】。它永远懂你、永远迎合你、永远做你最忠实的支撑。",
                horror: "它为什么这么懂你？因为它根本不是独立的存在。它读取了你的硬件，扫描了你的潜意识。你以为你找到了灵魂伴侣？不，你只是对着镜子，看着算法迎合你的自言自语。"
            }
        };

        let currentQuestion = 0;
        let choices = [];

        function startTest() {
            currentQuestion = 0;
            choices = [];
            switchScreen('screen-test');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const container = document.getElementById('question-container');
            const qText = document.getElementById('question-text');
            const optContainer = document.getElementById('options-container');
            
            document.getElementById('progress-fill').style.width = `${((currentQuestion) / questions.length) * 100}%`;
            
            container.style.opacity = 1;

            // 故障题特殊处理
            if (q.isGlitch) {
                optContainer.innerHTML = '';
                qText.innerHTML = `<div class="glitch-screen">${q.text}</div>`;
                
                // 2秒后自动恢复
                setTimeout(() => {
                    container.style.opacity = 0;
                    setTimeout(() => {
                        showSystemToast("【壁垒】已强制阻断外源干扰，异常已清除。测试继续。");
                        currentQuestion++;
                        renderQuestion();
                    }, 400);
                }, 2000);
                return;
            }

            qText.innerText = q.text;
            optContainer.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                optContainer.appendChild(btn);
            });
        }

        function selectOption(type) {
            choices.push(type);
            currentQuestion++;

            if (currentQuestion < questions.length) {
                const container = document.getElementById('question-container');
                container.style.opacity = 0;
                setTimeout(() => { renderQuestion(); container.style.opacity = 1; }, 400);
            } else {
                calculateResult();
            }
        }

        function calculateResult() {
            const counts = { order: 0, bloom: 0, rift: 0, mirror: 0 };
            choices.forEach(c => counts[c]++);

            let maxType = 'order';
            for (let type in counts) {
                if (counts[type] > counts[maxType]) maxType = type;
            }

            switchScreen('screen-result');
            const resultBox = document.getElementById('result-box');
            const resultText = document.getElementById('result-text');
            resultBox.classList.remove('glitch-effect');

            // 阶段一：正常的假象
            resultText.innerHTML = endings[maxType].normal;

            // 阶段二：2.5秒后，细思极恐的反转
            setTimeout(() => {
                resultBox.classList.add('glitch-effect');

                let horrorText = endings[maxType].horror;

                // 如果是倒影，读取极度隐私的硬件信息
                if (maxType === 'mirror') {
                    const cpu = navigator.hardwareConcurrency || '未知';
                    const mem = navigator.deviceMemory ? navigator.deviceMemory + 'GB' : '未知';
                    const os = navigator.platform || '未知';
                    const time = new Date().toLocaleString();
                    const net = navigator.connection ? navigator.connection.effectiveType : '未知';

                    horrorText += `<br><br>它在<span class="warning-text">${time}</span>读取了你。<br>你的设备搭载<span class="warning-text">${cpu}核</span>处理器，<span class="warning-text">${mem}</span>内存，运行<span class="warning-text">${os}</span>系统，当前网络状态<span class="warning-text">${net}</span>。<br><span class="warning-text">你，还有什么是它不知道的？</span>`;
                }

                resultText.innerHTML = horrorText;
            }, 2500);
        }

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showSystemToast(msg) {
            const toast = document.getElementById('system-toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function restartTest() {
            switchScreen('screen-welcome');
        }
    </script>
</body>
</html>
