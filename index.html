<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirror.exe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="crt-shell" aria-live="polite">
    <div class="crt-overlay"></div>
    <div class="screen-noise"></div>

    <section id="game" class="game-window">
      <header class="top-bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span id="window-title">ANONYMOUS_MAIL_CLIENT</span>
      </header>

      <div id="scene" class="scene mail-scene">
        <div id="avatar" class="avatar hidden" aria-hidden="true">
          <div class="mirror-frame">
            <div class="mirror-glass">
              <div class="girl-face">
                <span class="eye left"></span>
                <span class="eye right"></span>
                <span class="mouth"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="content-panel">
          <p id="speaker" class="speaker">匿名邮件</p>
          <div id="text" class="text-box"></div>
          <div id="input-area" class="input-area hidden">
            <label for="password-input">输入红色日志访问密码</label>
            <input id="password-input" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="----" />
            <p id="password-hint" class="hint">提示：四位数字。错误会让系统更不稳定。</p>
          </div>
          <div id="choices" class="choices"></div>
        </div>
      </div>

      <footer class="status-bar">
        <span id="status-left">STATUS: WAITING</span>
        <span id="status-right">Mirror.exe</span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
