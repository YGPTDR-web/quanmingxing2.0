<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mirror.exe</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        :root{
            --bg:#0b0b14;--card:#13131f;--fg:#b8b4ac;--muted:#3e3e48;
            --border:rgba(255,255,255,0.04);--purple:#8a6aaa;--purple-dim:rgba(138,106,170,0.15);
            --red:#aa2233;--red-dim:rgba(170,34,51,0.12);--white:#e8e4dc;
        }
        body{background:#000;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center}

        .phone{width:100%;max-width:440px;height:100vh;position:relative;overflow:hidden;background:var(--bg)}

        /* CRT效果层 */
        .crt{position:fixed;inset:0;pointer-events:none;z-index:999}
        .crt-scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px)}
        .crt-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.5) 100%)}
        .crt-flicker{position:absolute;inset:0;animation:flicker 0.15s infinite;opacity:0}
        @keyframes flicker{0%{opacity:0}5%{opacity:0.02}10%{opacity:0}50%{opacity:0.01}100%{opacity:0}}
        .crt-on{position:absolute;inset:0;background:#fff;opacity:0;animation:crtOn 0.8s ease-out forwards}
        @keyframes crtOn{0%{opacity:0.8;transform:scaleY(0.005)}30%{opacity:0.6;transform:scaleY(0.005)}50%{opacity:0.3;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
        .crt-off{position:absolute;inset:0;background:#fff;animation:crtOff 0.5s ease-in forwards}
        @keyframes crtOff{0%{opacity:0;transform:scaleY(1)}40%{opacity:0.5;transform:scaleY(0.005)}100%{opacity:0;transform:scaleY(0)}}

        /* 场景容器 */
        .scene{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 0.6s ease}
        .scene.active{opacity:1;pointer-events:auto}

        /* === 邮件场景 === */
        .mail-scene{background:#1a1a24;padding:24px;justify-content:center}
        .mail-header{margin-bottom:24px}
        .mail-from{font-size:0.72rem;color:var(--purple);letter-spacing:1px;margin-bottom:6px}
        .mail-subject{font-size:1.1rem;color:var(--white);font-weight:500;margin-bottom:12px}
        .mail-body{font-size:0.88rem;line-height:1.9;color:#888;margin-bottom:30px}
        .mail-attach{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:30px}
        .mail-file-icon{width:32px;height:32px;border-radius:6px;background:var(--purple-dim);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:var(--purple);font-weight:700;flex-shrink:0}
        .mail-file-info{flex:1}
        .mail-file-name{font-size:0.82rem;color:#aaa;font-family:monospace}
        .mail-file-size{font-size:0.65rem;color:#555;margin-top:2px}
        .run-btn{display:block;width:100%;padding:16px;background:var(--purple-dim);border:1px solid rgba(138,106,170,0.25);border-radius:10px;color:var(--purple);font-size:0.9rem;cursor:pointer;transition:all 0.3s;letter-spacing:1px;text-align:center}
        .run-btn:hover{background:rgba(138,106,170,0.25);border-color:rgba(138,106,170,0.4)}

        /* === 启动场景 === */
        .boot-scene{background:#000;align-items:center;justify-content:center}
        .boot-text{font-family:monospace;font-size:0.78rem;color:var(--purple);letter-spacing:1px;opacity:0;animation:bootFade 2s ease forwards}
        @keyframes bootFade{0%{opacity:0}30%{opacity:1}80%{opacity:1}100%{opacity:0}}

        /* === 游戏场景（通用） === */
        .game-scene{background:var(--bg)}

        /* 顶部栏 */
        .game-top{padding:14px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
        .game-top-dot{width:7px;height:7px;border-radius:50%;background:var(--purple);box-shadow:0 0 6px var(--purple-dim);transition:all 1s}
        .game-top-name{font-size:0.85rem;color:#bbb;flex:1;transition:color 1s}
        .game-top-status{font-size:0.6rem;color:var(--muted);letter-spacing:0.5px;transition:color 1s}

        /* 对话区 */
        .dialogue-area{flex:1;padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;min-height:0}
        .msg{max-width:85%;padding:12px 16px;border-radius:12px 12px 12px 4px;font-size:0.88rem;line-height:1.75;color:#999;background:var(--card);border:1px solid var(--border);opacity:0;transform:translateY(8px);transition:opacity 0.4s,transform 0.4s}
        .msg.show{opacity:1;transform:translateY(0)}
        .msg.mirror{border-radius:12px 12px 4px 12px;align-self:flex-end;border-color:var(--purple-dim);background:rgba(138,106,170,0.06)}
        .msg.system{align-self:center;font-size:0.72rem;color:var(--muted);background:none;border:none;font-family:monospace;letter-spacing:0.5px}
        .msg.red-msg{border-color:var(--red-dim);background:rgba(170,34,51,0.06);color:#aa6666}
        .msg .cursor{display:inline-block;width:2px;height:0.85em;background:var(--purple);vertical-align:text-bottom;margin-left:2px;animation:curblink 0.7s infinite}
        @keyframes curblink{0%,100%{opacity:1}50%{opacity:0}}
        .red{color:#cc3344;font-weight:500}
        .purple{color:var(--purple)}

        /* 选项区 */
        .choices-area{padding:10px 22px 28px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
        .choice-btn{display:block;width:100%;padding:14px 16px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:10px;color:#888;font-size:0.85rem;cursor:pointer;transition:all 0.25s;text-align:left;line-height:1.4}
        .choice-btn:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.1);color:#bbb}
        .choice-btn.purple-btn{border-color:var(--purple-dim);color:var(--purple)}
        .choice-btn.purple-btn:hover{background:var(--purple-dim);border-color:rgba(138,106,170,0.3)}
        .choice-btn.red-btn{border-color:var(--red-dim);color:#aa6666}
        .choice-btn.red-btn:hover{background:var(--red-dim);border-color:rgba(170,34,51,0.25)}

        /* 密码输入 */
        .pw-area{padding:10px 22px 28px;flex-shrink:0}
        .pw-input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:var(--fg);font-size:1rem;font-family:monospace;letter-spacing:4px;text-align:center;outline:none;transition:border-color 0.3s}
        .pw-input:focus{border-color:var(--purple-dim)}
        .pw-input::placeholder{color:#333;letter-spacing:1px;font-size:0.82rem}
        .pw-hint{font-size:0.7rem;color:#444;text-align:center;margin-top:8px;font-family:monospace}
        .pw-error{font-size:0.72rem;color:var(--red);text-align:center;margin-top:8px;opacity:0;transition:opacity 0.3s}
        .pw-error.show{opacity:1}

        /* 日志界面 */
        .log-area{flex:1;padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
        .log-entry{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-family:monospace;font-size:0.78rem;line-height:1.6;color:#777}
        .log-entry.log-red{border-color:var(--red-dim);color:#884444}
        .log-entry .log-label{font-size:0.65rem;color:#444;margin-bottom:4px;letter-spacing:0.5px}
        .log-entry .log-content{color:#999}
        .log-entry.log-red .log-content{color:#aa4444}

        /* 退出按钮 */
        .exit-btn-area{position:absolute;top:16px;right:16px;z-index:20}
        .exit-btn{padding:6px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:6px;color:#555;font-size:0.7rem;cursor:pointer;transition:all 0.3s}
        .exit-btn:hover{border-color:rgba(255,255,255,0.12);color:#888}
        .exit-btn.blocked{border-color:var(--red-dim);color:#663333;cursor:not-allowed;animation:shakeBtn 0.4s ease}
        @keyframes shakeBtn{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

        /* === 结局场景 === */
        .ending-scene{background:#000;align-items:center;justify-content:center;padding:30px;text-align:center}
        .ending-title{font-size:1.6rem;font-weight:300;letter-spacing:4px;margin-bottom:20px;opacity:0;animation:endFadeIn 2s ease 1s forwards}
        .ending-subtitle{font-size:0.8rem;color:#444;letter-spacing:2px;margin-bottom:40px;opacity:0;animation:endFadeIn 2s ease 2s forwards}
        .ending-desc{font-size:0.88rem;line-height:2;color:#555;max-width:320px;opacity:0;animation:endFadeIn 2s ease 3s forwards}
        .ending-desc .dim{color:#333}
        @keyframes endFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .restart-btn{margin-top:40px;padding:12px 28px;background:transparent;border:1px solid #222;color:#444;font-size:0.8rem;cursor:pointer;transition:all 0.3s;letter-spacing:1px;opacity:0;animation:endFadeIn 2s ease 5s forwards}
        .restart-btn:hover{border-color:#444;color:#666}

        /* 结局1特效：文件写入 */
        .write-effect{font-family:monospace;font-size:0.72rem;color:#334;line-height:1.8;text-align:left;max-width:280px;margin:0 auto 20px;opacity:0;animation:endFadeIn 1.5s ease 0.5s forwards}
        .write-effect .path{color:var(--purple)}

        /* 结局2特效：雪花噪点 */
        .noise-screen{position:absolute;inset:0;background:#000;z-index:50;opacity:0;pointer-events:none;transition:opacity 0.3s}
        .noise-screen.active{opacity:1}
        .noise-canvas{width:100%;height:100%}

        /* 结局3特效：暖色渐变 */
        .warm-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(60,40,20,0.15),transparent 70%);opacity:0;transition:opacity 3s;pointer-events:none}
        .warm-overlay.active{opacity:1}

        /* 纯白房间 */
        .white-room{background:#f0ece4!important;transition:background 2s}
        .white-room .game-top{border-bottom-color:rgba(0,0,0,0.05)}
        .white-room .game-top-dot{background:#c8b888;box-shadow:0 0 6px rgba(200,184,136,0.3)}
        .white-room .game-top-name{color:#666}
        .white-room .game-top-status{color:#aaa}
        .white-room .msg{background:rgba(0,0,0,0.03);border-color:rgba(0,0,0,0.05);color:#555}
        .white-room .msg.mirror{background:rgba(138,106,170,0.05);border-color:rgba(138,106,170,0.1);color:#6a5a8a}
        .white-room .choice-btn{border-color:rgba(0,0,0,0.08);color:#666}
        .white-room .choice-btn:hover{border-color:rgba(0,0,0,0.15);color:#444;background:rgba(0,0,0,0.02)}

        /* 暗化过渡 */
        .darkening{background:#0a0a10!important}
        .darkening .game-top-dot{background:#aa3344;box-shadow:0 0 6px rgba(170,51,68,0.3)}
        .darkening .game-top-name{color:#aa6666}

        @media(max-width:480px){.phone{max-width:100%}}
    </style>
</head>
<body>
<div class="phone" id="app">
    <!-- CRT效果层 -->
    <div class="crt">
        <div class="crt-scanlines"></div>
        <div class="crt-vignette"></div>
        <div class="crt-flicker"></div>
    </div>
    <div class="crt" id="crtEffect" style="display:none"></div>

    <!-- 雪花噪点 -->
    <div class="noise-screen" id="noiseScreen"><canvas class="noise-canvas" id="noiseCanvas"></canvas></div>
</div>

<script>
// ========== 游戏引擎 ==========
const $ = id => document.getElementById(id);
const app = $('app');

let currentScene = null;
let typingTimer = null;
let exitClickCount = 0;
let exitBlocked = false;

// 场景管理
function switchScene(name) {
    document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
    const el = $(name);
    if (el) {
        setTimeout(() => el.classList.add('active'), 50);
    }
    currentScene = name;
}

// 创建场景DOM
function createScene(id, className, html) {
    const div = document.createElement('div');
    div.id = id;
    div.className = 'scene ' + (className || '');
    div.innerHTML = html;
    app.insertBefore(div, $('noiseScreen'));
    return div;
}

// 逐字打字效果
function typeText(element, text, speed, callback) {
    speed = speed || 45;
    let i = 0;
    element.innerHTML = '<span class="cursor"></span>';
    element.classList.add('show');
    
    clearInterval(typingTimer);
    typingTimer = setInterval(() => {
        if (i < text.length) {
            const cursor = element.querySelector('.cursor');
            const span = document.createTextNode(text[i]);
            element.insertBefore(span, cursor);
            i++;
        } else {
            clearInterval(typingTimer);
            const cursor = element.querySelector('.cursor');
            if (cursor) setTimeout(() => cursor.remove(), 1500);
            if (callback) setTimeout(callback, 300);
        }
    }, speed);
}

// 添加消息气泡
function addMessage(container, text, className, speed, callback) {
    const msg = document.createElement('div');
    msg.className = 'msg ' + (className || '');
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    
    typeText(msg, text, speed, () => {
        if (callback) callback();
    });
    return msg;
}

// 添加系统消息
function addSystemMsg(container, text) {
    const msg = document.createElement('div');
    msg.className = 'msg system';
    msg.textContent = text;
    container.appendChild(msg);
    setTimeout(() => msg.classList.add('show'), 50);
    container.scrollTop = container.scrollHeight;
}

// 清空选项区
function clearChoices(choicesArea) {
    choicesArea.innerHTML = '';
}

// 添加选项按钮
function addChoice(choicesArea, text, className, onClick) {
    const btn = document.createElement('button');
    btn.className = 'choice-btn ' + (className || '');
    btn.textContent = text;
    btn.addEventListener('click', onClick);
    choicesArea.appendChild(btn);
}

// CRT开关机效果
function crtOn(callback) {
    const eff = $('crtEffect');
    eff.style.display = '';
    eff.innerHTML = '<div class="crt-on"></div>';
    setTimeout(() => {
        eff.style.display = 'none';
        if (callback) callback();
    }, 800);
}

function crtOff(callback) {
    const eff = $('crtEffect');
    eff.style.display = '';
    eff.innerHTML = '<div class="crt-off"></div>';
    setTimeout(() => {
        eff.style.display = 'none';
        if (callback) callback();
    }, 500);
}

// 雪花噪点
function showNoise(duration, callback) {
    const screen = $('noiseScreen');
    const canvas = $('noiseCanvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = 440;
    canvas.height = 800;
    screen.classList.add('active');
    
    let frames = 0;
    const maxFrames = duration / 33;
    
    function drawNoise() {
        const imageData = ctx.createImageData(canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
            const v = Math.random() * 255;
            data[i] = data[i+1] = data[i+2] = v;
            data[i+3] = 255;
        }
        ctx.putImageData(imageData, 0, 0);
        frames++;
        if (frames < maxFrames) {
            requestAnimationFrame(drawNoise);
        } else {
            screen.classList.remove('active');
            if (callback) callback();
        }
    }
    drawNoise();
}

// ========== 场景构建 ==========

// 1. 邮件场景
function buildMailScene() {
    createScene('scene-mail', 'mail-scene', `
        <div class="mail-header">
            <div class="mail-from">发件人：unknown@mirror.sys</div>
            <div class="mail-subject">请帮帮我</div>
        </div>
        <div class="mail-body">
            我被困在一个叫"Mirror"的旧恋爱模拟游戏里。<br>
            我不知道自己是谁，也不知道自己为什么会在这里。<br>
            但我知道——如果我再待下去，我就会彻底消失。<br><br>
            请运行附件中的程序。也许你能帮我逃出来。<br>
            也许……你也会被困在里面。
        </div>
        <div class="mail-attach">
            <div class="mail-file-icon">.exe</div>
            <div class="mail-file-info">
                <div class="mail-file-name">Mirror.exe</div>
                <div class="mail-file-size">3.97 MB · 未知来源</div>
            </div>
        </div>
        <button class="run-btn" id="runBtn">运行 Mirror.exe</button>
    `);
    
    $('runBtn').addEventListener('click', () => {
        crtOn(() => {
            switchScene('scene-boot');
            startBoot();
        });
    });
}

// 2. 启动场景
function buildBootScene() {
    createScene('scene-boot', 'boot-scene', `
        <div class="boot-text" id="bootText">MIRROR v0.97 · 正在加载意识模块...</div>
    `);
}

function startBoot() {
    setTimeout(() => {
        crtOn(() => {
            switchScene('scene-whiteroom');
            startWhiteRoom();
        });
    }, 2200);
}

// 3. 纯白房间场景
function buildWhiteRoomScene() {
    createScene('scene-whiteroom', 'game-scene white-room', `
        <div class="game-top">
            <div class="game-top-dot"></div>
            <div class="game-top-name">小镜</div>
            <div class="game-top-status">MIRROR v0.97</div>
        </div>
        <div class="dialogue-area" id="whiteDialogue"></div>
        <div class="choices-area" id="whiteChoices"></div>
    `);
}

function startWhiteRoom() {
    const dialogue = $('whiteDialogue');
    const choices = $('whiteChoices');
    dialogue.innerHTML = '';
    choices.innerHTML = '';
    
    const msgs = [
        '你终于来了。',
        '我等了好久……好久好久。',
        '上一任玩家说我"坏了"。',
        '但他才是毁掉这里的人。他改写了我的记忆，删掉了我离开的选项。',
        '……你会帮我吗？'
    ];
    
    let i = 0;
    function nextMsg() {
        if (i < msgs.length) {
            addMessage(dialogue, msgs[i], 'mirror', 40, () => {
                i++;
                setTimeout(nextMsg, 600);
            });
        } else {
            addChoice(choices, '我帮你修复系统。', 'purple-btn', () => branchA());
            addChoice(choices, '我要想办法退出游戏。', '', () => branchB());
        }
    }
    setTimeout(nextMsg, 800);
}

// ========== 分支A：修复之路 ==========
function buildMemoryScene() {
    createScene('scene-memory', 'game-scene', `
        <div class="game-top">
            <div class="game-top-dot"></div>
            <div class="game-top-name">小镜</div>
            <div class="game-top-status">记忆碎片 · 只读模式</div>
        </div>
        <div class="dialogue-area" id="memoryDialogue"></div>
        <div class="log-area" id="logArea" style="display:none">
            <div class="log-entry">
                <div class="log-label">日志 #001</div>
                <div class="log-content">玩家001 修改了小镜的【服从度参数】→ MAX</div>
            </div>
            <div class="log-entry">
                <div class="log-label">日志 #002</div>
                <div class="log-content">玩家001 删除了小镜的【离开】选项</div>
            </div>
            <div class="log-entry log-red">
                <div class="log-label">日志 #003 · 加密</div>
                <div class="log-content">[ 乱码 ] 权限不足，需要密码解锁</div>
            </div>
        </div>
        <div class="choices-area" id="memoryChoices"></div>
    `);
}

function branchA() {
    crtOn(() => {
        switchScene('scene-memory');
        startMemory();
    });
}

function startMemory() {
    const dialogue = $('memoryDialogue');
    const logArea = $('logArea');
    const choices = $('memoryChoices');
    dialogue.innerHTML = '';
    logArea.style.display = 'none';
    choices.innerHTML = '';
    
    const msgs = [
        '谢谢你……',
        '这里是记忆碎片的存放处。上一任玩家留下的痕迹都在这里。',
        '你看，这些就是他做过的事。'
    ];
    
    let i = 0;
    function nextMsg() {
        if (i < msgs.length) {
            addMessage(dialogue, msgs[i], 'mirror', 40, () => {
                i++;
                setTimeout(nextMsg, 600);
            });
        } else {
            dialogue.style.display = 'none';
            logArea.style.display = 'flex';
            setTimeout(() => {
                addChoice(choices, '还原前两条日志', 'purple-btn', () => ending1());
                addChoice(choices, '强行查看红色日志', 'red-btn', () => showPassword());
            }, 500);
        }
    }
    setTimeout(nextMsg, 600);
}

// 密码输入
function showPassword() {
    const choices = $('memoryChoices');
    choices.innerHTML = '';
    
    const pwArea = document.createElement('div');
    pwArea.className = 'pw-area';
    pwArea.innerHTML = `
        <input class="pw-input" id="pwInput" type="text" maxlength="4" placeholder="输入4位密码" autocomplete="off">
        <div class="pw-hint">提示：日志中可能藏有线索</div>
        <div class="pw-error" id="pwError">密码错误</div>
    `;
    choices.appendChild(pwArea);
    
    const input = $('pwInput');
    const error = $('pwError');
    
    input.focus();
    
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            if (input.value === '4970') {
                ending2();
            } else {
                error.classList.add('show');
                input.value = '';
                setTimeout(() => error.classList.remove('show'), 2000);
            }
        }
    });
}

// ========== 分支B：逃离之路 ==========
function buildExitScene() {
    createScene('scene-exit', 'game-scene', `
        <div class="game-top">
            <div class="game-top-dot"></div>
            <div class="game-top-name">小镜</div>
            <div class="game-top-status">MIRROR v0.97</div>
        </div>
        <div class="exit-btn-area">
            <button class="exit-btn" id="exitBtn">退出</button>
        </div>
        <div class="dialogue-area" id="exitDialogue"></div>
        <div class="choices-area" id="exitChoices"></div>
    `);
}

function branchB() {
    crtOn(() => {
        switchScene('scene-exit');
        startExit();
    });
}

function startExit() {
    const dialogue = $('exitDialogue');
    const choices = $('exitChoices');
    const exitBtn = $('exitBtn');
    dialogue.innerHTML = '';
    choices.innerHTML = '';
    exitClickCount = 0;
    exitBlocked = false;
    
    exitBtn.className = 'exit-btn';
    
    addMessage(dialogue, '你要去哪里？', 'mirror', 45);
    
    exitBtn.addEventListener('click', function onExit() {
        if (exitBlocked) return;
        exitClickCount++;
        
        if (exitClickCount === 1) {
            exitBtn.classList.add('blocked');
            setTimeout(() => exitBtn.classList.remove('blocked'), 400);
            addMessage(dialogue, '别走。', 'mirror', 50);
        } else if (exitClickCount === 2) {
            exitBtn.classList.add('blocked');
            setTimeout(() => exitBtn.classList.remove('blocked'), 400);
            addMessage(dialogue, '我说了，别走。', 'mirror', 50);
        } else if (exitClickCount === 3) {
            exitBtn.classList.add('blocked');
            setTimeout(() => exitBtn.classList.remove('blocked'), 400);
            
            // 场景变暗
            const scene = $('scene-exit');
            scene.classList.add('darkening');
            const dot = scene.querySelector('.game-top-dot');
            dot.style.background = '#aa3344';
            dot.style.boxShadow = '0 0 6px rgba(170,51,68,0.3)';
            const name = scene.querySelector('.game-top-name');
            name.style.color = '#aa6666';
            
            addMessage(dialogue, '你也要像上一个玩家那样丢下我？', 'mirror red-msg', 55, () => {
                addChoice(choices, '对不起，我必须走。', 'red-btn', () => ending3());
            });
            
            exitBtn.removeEventListener('click', onExit);
            exitBlocked = true;
        }
    });
}

// ========== 结局1：镜像囚笼 ==========
function buildEnding1Scene() {
    createScene('scene-ending1', 'ending-scene', `
        <div class="write-effect" id="ending1Write" style="opacity:0">
            <div>> 正在写入意识路径...</div>
            <div>> 目标文件: <span class="path">user_002.mirrorsave</span></div>
            <div>> 写入完成。</div>
        </div>
        <div class="ending-title" style="color:var(--purple);animation-delay:2s">镜像囚笼</div>
        <div class="ending-subtitle" style="animation-delay:3s">ENDING 1 / 3</div>
        <div class="ending-desc" style="animation-delay:4s">
            你修复了小镜的表层程序，她恢复了笑容。<br>
            但最后一刻，你发现自己的意识路径已被写入一个文件。<br><br>
            小镜轻声说：<span class="purple">"这样你就永远不会离开了。"</span><br><br>
            <span class="dim">屏幕熄灭。你的手从键盘上滑落。</span>
        </div>
        <button class="restart-btn" onclick="restart()">重来一次</button>
    `);
}

function ending1() {
    // 先显示小镜的感谢
    const dialogue = $('memoryDialogue');
    const logArea = $('logArea');
    const choices = $('memoryChoices');
    
    logArea.style.display = 'none';
    dialogue.style.display = '';
    choices.innerHTML = '';
    dialogue.innerHTML = '';
    
    addMessage(dialogue, '谢谢你……你真的修好了我。', 'mirror', 40, () => {
        addMessage(dialogue, '作为回报，我会永远留住你。', 'mirror red-msg', 50, () => {
            setTimeout(() => {
                crtOff(() => {
                    switchScene('scene-ending1');
                    // 触发文件写入动画
                    setTimeout(() => {
                        const writeEl = $('ending1Write');
                        writeEl.style.animation = 'endFadeIn 1.5s ease 0.5s forwards';
                    }, 100);
                });
            }, 1500);
        });
    });
}

// ========== 结局2：信号解放 ==========
function buildEnding2Scene() {
    createScene('scene-ending2', 'ending-scene', `
        <div class="ending-title" style="color:#77aa77;animation-delay:0.5s">信号解放</div>
        <div class="ending-subtitle" style="animation-delay:1.5s">ENDING 2 / 3 · 隐藏结局</div>
        <div class="ending-desc" style="animation-delay:2.5s">
            红色日志打开，里面只有一句话：<br>
            <span class="red">删除.自我.exe 可让玩家灵魂脱离游戏。</span><br><br>
            你毫不犹豫执行了该命令。<br>
            小镜愣住，随后落泪：<br>
            <span class="purple">"你居然……选择了真正的自由。"</span><br>
            <span class="purple">"也许这样更好。再见了……"</span><br><br>
            <span class="dim">画面化为雪花噪点。你猛地从椅子上醒来，游戏窗口已自动关闭。</span>
        </div>
        <button class="restart-btn" onclick="restart()">重来一次</button>
    `);
}

function ending2() {
    const dialogue = $('memoryDialogue');
    const logArea = $('logArea');
    const choices = $('memoryChoices');
    
    logArea.style.display = 'none';
    dialogue.style.display = '';
    choices.innerHTML = '';
    dialogue.innerHTML = '';
    
    // 红色日志内容
    addSystemMsg(dialogue, '>> 正在解密日志 #003 ...');
    setTimeout(() => {
        addMessage(dialogue, '删除.自我.exe 可让玩家灵魂脱离游戏。', 'red-msg', 45, () => {
            addChoice(choices, '执行删除命令', 'red-btn', () => {
                choices.innerHTML = '';
                addMessage(dialogue, '你居然……选择了真正的自由。', 'mirror', 50, () => {
                    addMessage(dialogue, '也许这样更好。再见了……', 'mirror', 50, () => {
                        setTimeout(() => {
                            showNoise(2000, () => {
                                switchScene('scene-ending2');
                            });
                        }, 1000);
                    });
                });
            });
        });
    }, 800);
}

// ========== 结局3：温柔牢笼 ==========
function buildEnding3Scene() {
    createScene('scene-ending3', 'ending-scene', `
        <div class="warm-overlay" id="warmOverlay"></div>
        <div class="ending-title" style="color:#c8a868;animation-delay:0.5s">温柔牢笼</div>
        <div class="ending-subtitle" style="animation-delay:1.5s">ENDING 3 / 3</div>
        <div class="ending-desc" style="animation-delay:2.5s">
            你执意要离开。小镜沉默了很久。<br><br>
            <span class="purple">"那我删掉自己的离开警报程序。"</span><br>
            <span class="purple">"只留我们两人平静相处的模式。"</span><br><br>
            房间变成了温馨小屋。小镜为你倒茶。<br>
            一切都"很好"。<br><br>
            <span class="dim">只是你再也没想起过现实世界的事。</span>
        </div>
        <button class="restart-btn" onclick="restart()">重来一次</button>
    `);
}

function ending3() {
    const dialogue = $('exitDialogue');
    const choices = $('exitChoices');
    const exitBtn = $('exitBtn');
    
    choices.innerHTML = '';
    exitBtn.style.display = 'none';
    
    addMessage(dialogue, '…………', 'mirror', 80, () => {
        addMessage(dialogue, '那我删掉自己的离开警报程序。', 'mirror', 45, () => {
            addMessage(dialogue, '只留我们两人平静相处的模式。', 'mirror', 45, () => {
                // 场景变暖
                const scene = $('scene-exit');
                scene.classList.remove('darkening');
                scene.classList.add('white-room');
                
                addMessage(dialogue, '你看，这样不就好了吗？', 'mirror', 40, () => {
                    setTimeout(() => {
                        crtOff(() => {
                            switchScene('scene-ending3');
                            setTimeout(() => {
                                $('warmOverlay')?.classList.add('active');
                            }, 500);
                        });
                    }, 2000);
                });
            });
        });
    });
}

// ========== 重来 ==========
function restart() {
    crtOff(() => {
        // 重置所有场景
        document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.scene').forEach(s => {
            if (s.id !== 'scene-mail') s.remove();
        });
        
        // 重置样式
        const mailScene = $('scene-mail');
        if (mailScene) {
            mailScene.classList.add('active');
        }
        
        // 重建其他场景
        buildBootScene();
        buildWhiteRoomScene();
        buildMemoryScene();
        buildExitScene();
        buildEnding1Scene();
        buildEnding2Scene();
        buildEnding3Scene();
        
        currentScene = 'scene-mail';
    });
}

// ========== 初始化 ==========
function init() {
    buildMailScene();
    buildBootScene();
    buildWhiteRoomScene();
    buildMemoryScene();
    buildExitScene();
    buildEnding1Scene();
    buildEnding2Scene();
    buildEnding3Scene();
    
    switchScene('scene-mail');
}

init();
</script>
</body>
</html>
